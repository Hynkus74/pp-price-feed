name: Update fund prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update prices
        run: |
          python update_prices.py
          python update_btc.py
          python update_wood.py
          
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CZ1005100543.json CZ0008477551.json BTC-CZK.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Update fund and BTC prices"
            git push
          fi
