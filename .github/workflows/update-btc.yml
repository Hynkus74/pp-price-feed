name: Update BTC prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  update-btc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update BTC prices
        run: python update_btc.py

      - name: Commit BTC prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC-CZK.json
          if git diff --cached --quiet; then
            echo "No BTC price changes"
          else
            git commit -m "Update BTC-CZK prices"
            git push
          fi
